# Central configuration for the climatologies pipeline. See README.md for
# the full design rationale. Edit this file to change eras, periods,
# models, ensemble membership, paths, or SLURM resources -- none of the
# Python code should need to change for those kinds of edits.

paths:
  # Large intermediate + final outputs live here. This is the only path that must be changed for a new user.
  # All other paths are relative to this root.
  # The output directory must be on a filesystem with enough space to hold the final zarr and netcdf outputs.
  output_root: /beegfs/CMIP6/jdpaul3/climatologies

# Temperature unit for the output. "celsius" (default) applies a K -> degC
# shift to tmax/tmin/tmean (the source data is always Kelvin); dtr's stored
# values never change between unit systems since it's a difference, not an
# absolute temperature (see units.py) -- only its units label follows this
# setting, for consistency with the other temperature variables.
# "kelvin" leaves everything in the source data's native units.
units:
  temperature_unit: celsius
  temperature_vars: [tmax, tmin, tmean, dtr]

# One entry per source variable family. `adjusted_glob` uses {model} and
# {scenario} placeholders that build_job_list.py expands/parses. hurs and
# hursmin point at the *_squeezed subdirectories --
# the unsqueezed siblings in the parent adjusted/ dir are never read.
source_families:
  tasmax:
    output_var: tmax
    cmip6_var: tasmax
    era5_var: t2max
    units: K
    long_name: daily maximum near-surface air temperature
    adjusted_glob: /beegfs/CMIP6/jdpaul3/cmip6_downscaled_llm_fixes_12km_original_vars/cmip6_12km_downscaling/adjusted/tasmax_{model}_{scenario}_adjusted.zarr
    era5_zarr: /beegfs/CMIP6/jdpaul3/cmip6_downscaled_llm_fixes_12km_original_vars/cmip6_12km_downscaling/era5_zarr/t2max_era5.zarr
  tasmin:
    output_var: tmin
    cmip6_var: tasmin
    era5_var: t2min
    units: K
    long_name: daily minimum near-surface air temperature
    adjusted_glob: /beegfs/CMIP6/jdpaul3/cmip6_downscaled_llm_fixes_12km_original_vars/cmip6_12km_downscaling/adjusted/tasmin_{model}_{scenario}_adjusted.zarr
    era5_zarr: /beegfs/CMIP6/jdpaul3/cmip6_downscaled_llm_fixes_12km_original_vars/cmip6_12km_downscaling/era5_zarr/t2min_era5.zarr
  dtr:
    output_var: dtr
    cmip6_var: dtr
    era5_var: dtr
    units: K
    long_name: diurnal temperature range (bias-adjusted independently, not derived from Tmax-Tmin)
    adjusted_glob: /beegfs/CMIP6/jdpaul3/cmip6_downscaled_llm_fixes_12km_original_vars/cmip6_12km_downscaling/adjusted/dtr_{model}_{scenario}_adjusted.zarr
    era5_zarr: /beegfs/CMIP6/jdpaul3/cmip6_downscaled_llm_fixes_12km_original_vars/cmip6_12km_downscaling/era5_zarr/dtr_era5.zarr
  pr:
    output_var: pr
    cmip6_var: pr
    era5_var: pr
    units: mm d-1
    long_name: daily total precipitation
    adjusted_glob: /beegfs/CMIP6/jdpaul3/cmip6_downscaled_llm_fixes_12km_original_vars/cmip6_12km_downscaling/adjusted/pr_{model}_{scenario}_adjusted.zarr
    era5_zarr: /beegfs/CMIP6/jdpaul3/cmip6_downscaled_llm_fixes_12km_original_vars/cmip6_12km_downscaling/era5_zarr/pr_era5.zarr
  hurs:
    output_var: hurs
    cmip6_var: hurs
    era5_var: rh2_mean
    units: "%"
    long_name: daily mean near-surface relative humidity
    adjusted_glob: /beegfs/CMIP6/jdpaul3/cmip6_downscaled_llm_fixes_12km_new_vars/sfcWind_hurs_hursmin/adjusted/hurs_squeezed/hurs_{model}_{scenario}_squeezed.zarr
    era5_zarr: /beegfs/CMIP6/jdpaul3/cmip6_downscaled_llm_fixes_12km_new_vars/sfcWind_hurs_hursmin/era5_zarr/rh2_mean_era5.zarr
  hursmin:
    output_var: hursmin
    cmip6_var: hursmin
    era5_var: rh2_min
    units: "%"
    long_name: daily minimum near-surface relative humidity
    adjusted_glob: /beegfs/CMIP6/jdpaul3/cmip6_downscaled_llm_fixes_12km_new_vars/sfcWind_hurs_hursmin/adjusted/hursmin_squeezed/hursmin_{model}_{scenario}_squeezed.zarr
    era5_zarr: /beegfs/CMIP6/jdpaul3/cmip6_downscaled_llm_fixes_12km_new_vars/sfcWind_hurs_hursmin/era5_zarr/rh2_min_era5.zarr
  sfcWind:
    output_var: sfcwind
    cmip6_var: sfcWind
    era5_var: wspd10_mean
    units: m s-1
    long_name: daily mean near-surface wind speed
    adjusted_glob: /beegfs/CMIP6/jdpaul3/cmip6_downscaled_llm_fixes_12km_new_vars/sfcWind_hurs_hursmin/adjusted/sfcWind_{model}_{scenario}_adjusted.zarr
    era5_zarr: /beegfs/CMIP6/jdpaul3/cmip6_downscaled_llm_fixes_12km_new_vars/sfcWind_hurs_hursmin/era5_zarr/wspd10_mean_era5.zarr
  snw:
    output_var: snw
    cmip6_var: snw
    era5_var: snow_mean
    units: kg m-2
    long_name: surface snow water equivalent
    adjusted_glob: /beegfs/CMIP6/jdpaul3/cmip6_downscaled_llm_fixes_12km_snw_2/snw/adjusted/snw_{model}_{scenario}_adjusted.zarr
    era5_zarr: /beegfs/CMIP6/jdpaul3/cmip6_downscaled_llm_fixes_12km_snw_2/snw/era5_zarr/snow_mean_era5.zarr

# Derived variables computed inside compute_fragment.py rather than read
# directly from a source family.
derived:
  tmean:
    output_var: tmean
    requires: [tasmax, tasmin]
    units: K
    long_name: daily mean near-surface air temperature
    description: Daily mean temperature, computed as (tmax + tmin) / 2 from daily tmax/tmin before temporal aggregation.
  pr_tot:
    output_var: pr_tot
    requires: [pr]
    units: mm
    long_name: total precipitation accumulated over the period
    description: >
      Sum of daily precipitation over all days in the period, computed per calendar
      year (using the period's season-year convention), then aggregated
      (temporal_min/temporal_mean/temporal_max) across the years within
      the era. E.g. for period=Apr, this is the distribution of total
      April precipitation across the era's years -- answers questions like
      "what is the maximum April rainfall for era 2040-2069?".

# Exact order of the 10 master output variables in the final Dataset.
# Must contain exactly the set of output_var values produced by
# source_families + derived above (load_config() validates this and
# raises if they ever drift apart -- e.g. a new variable added to
# source_families but forgotten here).
output_variable_order:
  - tmin
  - tmax
  - tmean
  - dtr
  - pr
  - pr_tot
  - hurs
  - hursmin
  - sfcwind
  - snw

# Order here is preserved exactly in the output model dimension (followed
# by the ensemble name, then the reference model -- see combine.py).
models:
  - CESM2
  - CNRM-CM6-1-HR
  - E3SM-2-0
  - EC-Earth3-Veg
  - GFDL-ESM4
  - HadGEM3-GC31-LL
  - HadGEM3-GC31-MM
  - KACE-1-0-G
  - MIROC6
  - MPI-ESM1-2-HR
  - MRI-ESM2-0
  - NorESM2-MM
  - TaiESM1

reference_model: WRF-ERA5

ensemble:
  name: CMIP6-Ensemble
  # Configurable subset of `models` averaged (nanmean, skip members with no
  # data for a given slice) to form the multi-model mean. Defaults to all
  # models above.
  members:
    - CESM2
    - CNRM-CM6-1-HR
    - E3SM-2-0
    - EC-Earth3-Veg
    - GFDL-ESM4
    - HadGEM3-GC31-LL
    - HadGEM3-GC31-MM
    - KACE-1-0-G
    - MIROC6
    - MPI-ESM1-2-HR
    - MRI-ESM2-0
    - NorESM2-MM
    - TaiESM1

scenarios:
  - historical
  - ssp126
  - ssp245
  - ssp370
  - ssp585

# Edit freely. name is used as the era coordinate label; start_year/end_year
# are inclusive calendar years (see periods.py's module docstring for how
# cross-year seasons like DJF/ONDJFM are assigned to a year).
eras:
  - name: "1981-2010"
    start_year: 1981
    end_year: 2010
  - name: "1965-2014"
    start_year: 1965
    end_year: 2014
  - name: "2040-2069"
    start_year: 2040
    end_year: 2069
  - name: "2070-2099"
    start_year: 2070
    end_year: 2099

# months must be in chronological order (not necessarily ascending --
# order is what determines year-wrap detection for DJF/ONDJFM, see
# periods.py).
periods:
  - name: Jan
    months: [1]
  - name: Feb
    months: [2]
  - name: Mar
    months: [3]
  - name: Apr
    months: [4]
  - name: May
    months: [5]
  - name: Jun
    months: [6]
  - name: Jul
    months: [7]
  - name: Aug
    months: [8]
  - name: Sep
    months: [9]
  - name: Oct
    months: [10]
  - name: Nov
    months: [11]
  - name: Dec
    months: [12]
  - name: DJF
    months: [12, 1, 2]
  - name: MAM
    months: [3, 4, 5]
  - name: JJA
    months: [6, 7, 8]
  - name: SON
    months: [9, 10, 11]
  - name: AMJJAS
    months: [4, 5, 6, 7, 8, 9]
  - name: ONDJFM
    months: [10, 11, 12, 1, 2, 3]

aggregations:
  - temporal_min
  - temporal_mean
  - temporal_max

# Any one zarr store that carries 2D lat/lon + spatial_ref (CRS) auxiliary
# coordinates on the same grid as everything else. These are invariant
# across models/scenarios, so we just copy them once into the master
# output rather than recomputing/duplicating per fragment.
grid_reference:
  zarr_path: /beegfs/CMIP6/jdpaul3/cmip6_downscaled_llm_fixes_12km_original_vars/cmip6_12km_downscaling/adjusted/tasmax_MIROC6_historical_adjusted.zarr

slurm:
  partition: analysis
  conda_env: cmip6-utils
  fragments:
    mem: "128G"
    cpus_per_task: 4
    time: "01:00:00"
    array_concurrency: 12
  combine:
    mem: "400G"
    cpus_per_task: 8
    time: "02:00:00"
  qc:
    mem: "64G"
    cpus_per_task: 4
    time: "00:30:00"

output:
  zarr_name: cmip6_wrf_climatologies.zarr
  netcdf_name: cmip6_wrf_climatologies.nc
  netcdf_compression_level: 4

# All human-readable text that ends up in the output's attributes lives here --
# metadata.py only assembles these templates with computed values (era
# lists, ensemble member lists, etc); it has no hardcoded text of its own.
# {placeholder} fields are filled in by metadata.py via str.format().
metadata:
  global_attrs:
    title: "Climatologies of downscaled, bias-adjusted CMIP6 and WRF-downscaled ERA5 data for Alaska"
    institution: "Scenarios Network for Alaska and Arctic Planning, International Arctic Research Center, University of Alaska Fairbanks; Alaska Climate Adaptation Science Center, University of Alaska Fairbanks"
    summary: >
      Temporal min/mean/max climatologies by calendar period (month or season)
      and climatological era, for 13 CMIP6 models, a multi-model ensemble mean,
      and the WRF-downscaled ERA5 reference. See the model, scenario, era,
      period, and aggregation coordinate attributes, and each data variable's
      own attributes, for full methodology.
    conventions: "CF-1.8"
    history_template: "{timestamp}Z: created by cmip6-utils/climatologies pipeline."

  # Applies to every data variable except pr_tot (which has its own
  # two-stage methodology described in derived.pr_tot.description above).
  direct_method_note: >
    Aggregation (see the aggregation dimension) is computed directly over
    every day falling in the given period and era -- e.g. temporal_max is
    the single most extreme day's value within that period+era, not an
    average of yearly extremes.

  dimensions:
    era:
      long_name: climatological era
      description_template: "Climatological era. {era_lines}"
      line_template: "{name}: {start_year}-01-01 to {end_year}-12-31 inclusive."
    model:
      long_name: model
      description_template: >
        Model or model-ensemble identifier. '{ensemble_name}' is the
        equal-weighted multi-model mean, computed via nanmean (skipping any
        member with no data for a given variable/scenario/era/period/aggregation
        slice -- only NaN if zero members have data) across these
        {n_members} members: {members}. '{reference_model}' is the
        WRF-downscaled ERA5 reanalysis used as the downscaling/bias-adjustment
        reference; it is only populated under scenario='historical'.
    period:
      long_name: period
      description_template: "Period over which the temporal aggregation is computed. {period_lines}."
      line_template: "{name}: {month_names}{wrap_suffix}"
      wrap_suffix: " (season-year = calendar year of the last listed month)"
    scenario:
      long_name: scenario
      description_template: >
        CMIP6 experiment/scenario. 'historical' covers the historical run and
        is also the only scenario populated for the WRF-ERA5 reference.
        ssp126/ssp245/ssp370/ssp585 are ScenarioMIP future projections.
    aggregation:
      long_name: temporal aggregation method
      description_template: >
        Temporal aggregation applied within each period+era. See each data
        variable's own attributes for the exact methodology -- it differs for
        pr_tot (aggregated across per-year period-sums) versus every other
        variable (aggregated directly over days).

# Parameters for qc.py (run manually after a pipeline run -- see README.md).
qc:
  delta_maps:
    # ERA5 historical baseline that projections are compared against.
    baseline:
      model: WRF-ERA5
      scenario: historical
      era: "1981-2010"
    projection_model: CMIP6-Ensemble
    future_eras: ["2040-2069", "2070-2099"]
    scenarios: [ssp126, ssp245, ssp370, ssp585]
    # Delta maps are rendered for every configured Period automatically
    # (no separate period list here -- the master output already has all of them).
    aggregation: temporal_mean
  calc_checks:
    # relative tolerance for the pr_tot/tmean exact-identity checks (float32 roundoff)
    rtol: 1.0e-3
    # noleap calendar applies to every CMIP6 model; WRF-ERA5 uses a real
    # gregorian calendar (variable Feb length), so it's excluded from the
    # pr_tot day-count identity check specifically.
    fixed_calendar_models_excluded: [WRF-ERA5]
